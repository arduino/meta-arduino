# Arduino owns the USB gadget composition: adbd must not build/tear down its own
# single-function 'adb' gadget (see android-tools-conf 10-adbd-configfs.conf).
# When adbd is enabled, it manages the full composite gadget lifecycle through
# arduino-gadget-setup.
[Unit]
Conflicts=usb-gadget.service

[Service]
ExecStartPre=
ExecStartPre=/usr/bin/arduino-gadget-setup start
ExecStartPost=
ExecStartPost=/usr/bin/arduino-gadget-setup bind
ExecStopPost=
ExecStopPost=/usr/bin/arduino-gadget-setup stop
