name: Hardware Test (LAVA)

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Run ID of a completed 'Build Yocto' / 'Nightly Build' run whose qcom-distro build-url_imola/monza artifacts should be flashed and tested"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-qcom-distro:
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write
    # Pinned to the same meta-qcom-arduino commit as meta-arduino-qcom/ci/*.lock.yml,
    # so the test plan matches the layer revision the image was built from.
    uses: qualcomm-linux/meta-qcom-arduino/.github/workflows/test-distro.yml@88865373932d9f7178917017b4c513f2194381ed
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
    with:
      # test-distro.yml's lava-test-plans action downloads build-url_<device>_<distro>
      # artifacts straight from this run id (actions/download-artifact supports
      # cross-run lookups given actions:read), so this has to name the build
      # run, not this workflow's own run.
      build_id: ${{ inputs.build_run_id }}
      # Boot-only for now: leaving devices_premerge unset skips the pre-merge
      # suite entirely
      devices: "uno-q,ventuno-q"
      project_name: "meta-qcom-arduino"
      distro_name: "qcom-distro"
      lava_test_plans_ref: "a64f1c400dec9569dfa9d920ba28162ca91cf9e6"
      testkit_ref: "testkit-2026.09.27"
