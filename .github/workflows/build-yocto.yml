name: Build Yocto

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile (full | pr)"
        required: false
        type: string
        default: "full"
      skip_if_github_cached:
        description: "Skip the build matrix if the github actions cache already records a previously-successful run"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      profile:
        required: false
        type: string
        default: "full"
      skip_if_github_cached:
        required: false
        type: boolean
        default: false
    outputs:
      build_skipped:
        description: "True when the compile matrix was skipped"
        value: ${{ jobs.github-cache-check.outputs.cache_hit }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: true

env:
  CACHE_DIR: /efsx/qli/meta-qcom
  KAS_CLONE_DEPTH: 1

jobs:
  kas-setup:
    if: github.repository_owner == 'arduino'
    runs-on: ["self-hosted", "arduino-prd-u2404-amd64-large-od-ephem"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Symlink CI directory if needed
        run: |
          if [ ! -d ci ] && [ -d meta-arduino-qcom/ci ]; then
            ln -s meta-arduino-qcom/ci ci
          fi

      - name: Setting up kas-container
        run: |
          KAS_CONTAINER=$GITHUB_WORKSPACE/kas-container
          echo "KAS_CONTAINER=$KAS_CONTAINER" >> $GITHUB_ENV
          LATEST=$(git ls-remote --tags --refs --sort="v:refname" https://github.com/siemens/kas | tail -n1 | sed 's/.*\///')
          wget -qO ${KAS_CONTAINER} https://raw.githubusercontent.com/siemens/kas/refs/tags/$LATEST/kas-container
          chmod +x ${KAS_CONTAINER}

      - name: Run kas lock
        run: |
          ${KAS_CONTAINER} lock ci/imola.yml
          ${KAS_CONTAINER} lock ci/monza.yml

      - name: Upload kas
        uses: actions/upload-artifact@v6
        with:
          name: kas
          if-no-files-found: error
          path: |
            ci/*.lock.yml
            meta-arduino-qcom/ci/*.lock.yml
            kas-container

  github-cache-check:
    needs: kas-setup
    if: github.repository_owner == 'arduino'
    runs-on: ubuntu-latest
    outputs:
      cache_hit: ${{ steps.restore.outputs.cache-hit == 'true' }}
      run_hash: ${{ steps.hash.outputs.run_hash }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download kas
        uses: actions/download-artifact@v7
        with:
          name: kas

      - name: Symlink CI directory if needed
        run: |
          if [ ! -d ci ] && [ -d meta-arduino-qcom/ci ]; then
            ln -s meta-arduino-qcom/ci ci
          fi

      - name: Compute build input hash
        id: hash
        run: |
          LOCK_HASH=$(sha256sum ci/base.lock.yml 2>/dev/null || sha256sum meta-arduino-qcom/ci/base.lock.yml | cut -d' ' -f1)
          SRC_HASH=$(git rev-parse HEAD)
          RUN_HASH=$(printf '%s\n%s' "$LOCK_HASH" "$SRC_HASH" | sha256sum | cut -d' ' -f1)
          echo "base.lock.yml hash: $LOCK_HASH"
          echo "HEAD SHA: $SRC_HASH"
          echo "Combined run hash: $RUN_HASH"
          echo "run_hash=$RUN_HASH" >> "$GITHUB_OUTPUT"

      - name: Look up previous successful build marker in github cache
        id: restore
        uses: actions/cache/restore@v5
        with:
          path: /tmp/build-success-marker
          key: build-success-${{ github.repository }}-${{ github.workflow }}-${{ github.ref_name }}-${{ steps.hash.outputs.run_hash }}
          lookup-only: true

      - name: Report github-cache-check decision
        env:
          SKIP_IF_CACHED: ${{ inputs.skip_if_github_cached }}
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          RUN_HASH: ${{ steps.hash.outputs.run_hash }}
        run: |
          if [ "${SKIP_IF_CACHED}" != "true" ]; then
            echo "skip_if_github_cached not set; build will run"
          elif [ "${CACHE_HIT}" = "true" ]; then
            echo "Run cache hit on key build-success, hash ${RUN_HASH}: skipping build matrix"
          else
            echo "No previous successful build run recorded in github cache for this hash: build will run"
          fi

  yocto-run-checks:
    needs: [kas-setup, github-cache-check]
    if: |
      github.repository_owner == 'arduino' &&
      (inputs.skip_if_github_cached != true || needs.github-cache-check.outputs.cache_hit != 'true')
    runs-on: [self-hosted, qcom-u2404, amd64]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download kas
        uses: actions/download-artifact@v7
        with:
          name: kas

      - name: Symlink CI directory if needed
        run: |
          if [ ! -d ci ] && [ -d meta-arduino-qcom/ci ]; then
            ln -s meta-arduino-qcom/ci ci
          fi

      - name: Setting up kas-container
        run: |
          KAS_CONTAINER=$GITHUB_WORKSPACE/kas-container
          echo "KAS_CONTAINER=$KAS_CONTAINER" >> $GITHUB_ENV
          chmod +x $KAS_CONTAINER

      - name: Run Yocto patchreview
        run: |
          if [ -f ci/kas-container-shell-helper.sh ] && [ -f ci/yocto-patchreview.sh ]; then
            ci/kas-container-shell-helper.sh ci/yocto-patchreview.sh || true
          fi

      - name: Run yocto-check-layer
        run: |
          if [ -f ci/kas-container-shell-helper.sh ] && [ -f ci/yocto-check-layer.sh ]; then
            ci/kas-container-shell-helper.sh ci/yocto-check-layer.sh || true
          fi

  compile-env:
    if: github.repository_owner == 'arduino'
    runs-on: ubuntu-latest
    outputs:
      CACHE_DIR: ${{ steps.compile_env.outputs.CACHE_DIR }}
    steps:
      - name: Setup compile variables
        id: compile_env
        run: |
          echo "CACHE_DIR=${{ env.CACHE_DIR }}" >> $GITHUB_OUTPUT

  compile:
    needs: [kas-setup, github-cache-check, compile-env]
    if: |
      github.repository_owner == 'arduino' &&
      (inputs.skip_if_github_cached != true || needs.github-cache-check.outputs.cache_hit != 'true')
    strategy:
      fail-fast: false
      matrix:
        machine:
          - imola
          - monza
        distro:
          - name: qcom-distro
            yamlfile: ""
        kernel:
          - type: default
            dirname: ""
            yamlfile: ""
    uses: ./.github/workflows/compile.yml
    with:
      name: ${{ matrix.machine }}
      enabled: true
      world: false
      target: true
      machine: ${{ matrix.machine }}
      distro_yaml: ${{ matrix.distro.yamlfile }}
      distro_name: ${{ matrix.distro.name }}
      kernel_yaml: ${{ matrix.kernel.yamlfile }}
      kernel_dirname: ${{ matrix.kernel.dirname }}
      cache_dir: ${{ needs.compile-env.outputs.CACHE_DIR }}

  publish_summary:
    needs: [github-cache-check, compile]
    if: |
      always() && github.repository_owner == 'arduino' &&
      (inputs.skip_if_github_cached != true || needs.github-cache-check.outputs.cache_hit != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: qualcomm-linux/meta-qcom/.github/actions/print-build-output@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: build-url*

  github-cache-save:
    needs: [github-cache-check, compile]
    if: |
      github.repository_owner == 'arduino' &&
      inputs.skip_if_github_cached == true &&
      needs.github-cache-check.outputs.cache_hit != 'true' &&
      needs.compile.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Create build success marker
        run: date -u +%FT%TZ > /tmp/build-success-marker

      - name: Save successful build marker to github cache
        uses: actions/cache/save@v5
        with:
          path: /tmp/build-success-marker
          key: build-success-${{ github.repository }}-${{ github.workflow }}-${{ github.ref_name }}-${{ needs.github-cache-check.outputs.run_hash }}

  build_successful:
    if: github.repository_owner == 'arduino'
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - name: Build completed successfully
        run: echo "All compile matrix jobs succeeded for imola and monza"
